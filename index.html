<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitmotif — mapping prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="head">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ru" aria-pressed="false">RU</button>
  </div>
  <p class="head__kicker" id="kicker">Prototype · step 1 of the project</p>
  <h1 class="head__title">Leitmotif</h1>
  <p class="head__lede" id="lede"></p>
  <p class="head__note" id="note"></p>
</header>

<main id="list" class="list"></main>

<footer class="foot">
  <h2 class="foot__title" id="foot-title">What is actually happening</h2>
  <div id="foot-body"></div>
  <p class="foot__fine">
    The sound is synthesised from scratch — no samples, no files, no server — and
    the same character always produces the same theme. MP3 encoding uses
    <a href="vendor/lamejs-LICENSE.txt">lamejs</a>, loaded only when you ask for a
    file.
  </p>
</footer>

<script src="mapping.js"></script>
<script src="music.js"></script>
<script src="characters.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
